
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Store Intelligence Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,Segoe UI,Arial,sans-serif;
  background:#020617;
  color:#e2e8f0;
  padding:32px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:28px;
}

h1{
  margin:0;
  font-size:28px;
}

.sub{
  color:#94a3b8;
  margin-top:8px;
  font-size:14px;
}

.live{
  display:inline-block;
  width:10px;
  height:10px;
  background:#22c55e;
  border-radius:50%;
  box-shadow:0 0 12px #22c55e;
  margin-right:8px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  margin-bottom:24px;
}

.card{
  background:linear-gradient(145deg,#0f172a,#1e293b);
  border:1px solid #334155;
  border-radius:18px;
  padding:24px;
  box-shadow:0 12px 32px rgba(0,0,0,.35);
}

.label{
  color:#94a3b8;
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.value{
  font-size:40px;
  font-weight:700;
  margin-top:10px;
}

.section{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:18px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}

.section h2{
  margin-top:0;
  margin-bottom:18px;
  color:#f8fafc;
}

.bar-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.bar-label{
  width:130px;
  color:#cbd5e1;
  font-size:14px;
}

.track{
  flex:1;
  background:#1e293b;
  height:18px;
  border-radius:999px;
  overflow:hidden;
}

.bar{
  height:100%;
  border-radius:999px;
}

.metric{
  color:#94a3b8;
  font-size:13px;
  width:42px;
}

footer{
  margin-top:30px;
  text-align:center;
  color:#64748b;
  font-size:13px;
}
</style>
</head>

<body>

<div class="header">
  <div>
    <h1>Store Intelligence Dashboard</h1>
    <div class="sub">
      <span class="live"></span>
      Live analytics · STORE_BLR_002 · refresh every 5s
    </div>
  </div>
</div>

<div class="grid" id="metrics"></div>

<div class="section">
  <h2>Conversion Funnel</h2>
  <div id="funnel"></div>
</div>

<div class="section">
  <h2>Zone Heatmap</h2>
  <div id="heatmap"></div>
</div>

<footer>
Store Intelligence • YOLOv8 + ByteTrack • FastAPI • SQLite
</footer>

<script>

const STORE="STORE_BLR_002";

async function load(){

  const metrics =
    await (await fetch(`/stores/${STORE}/metrics`)).json();

  const funnel =
    await (await fetch(`/stores/${STORE}/funnel`)).json();

  const heatmap =
    await (await fetch(`/stores/${STORE}/heatmap`)).json();

  document.getElementById("metrics").innerHTML = `
    <div class="card">
      <div class="label">Unique Visitors</div>
      <div class="value">${metrics.unique_visitors}</div>
    </div>

    <div class="card">
      <div class="label">Purchases</div>
      <div class="value">${metrics.purchases}</div>
    </div>

    <div class="card">
      <div class="label">Converted</div>
      <div class="value">${metrics.converted_visitors ?? 0}</div>
    </div>

    <div class="card">
      <div class="label">Conversion %</div>
      <div class="value">${metrics.conversion_rate_percent}%</div>
    </div>
  `;

  const funnelStages=[
    ["Entered",funnel.entered,"#38bdf8"],
    ["Browsed",funnel.browsed,"#22c55e"],
    ["Queued",funnel.queued,"#f59e0b"],
    ["Purchased",funnel.purchased,"#ef4444"]
  ];

  const maxF=Math.max(...funnelStages.map(s=>s[1]),1);

  document.getElementById("funnel").innerHTML =
    funnelStages.map(s=>`
      <div class="bar-row">

        <div class="bar-label">${s[0]}</div>

        <div class="track">
          <div class="bar"
               style="width:${(s[1]/maxF)*100}%;
               background:${s[2]}">
          </div>
        </div>

        <div class="metric">${s[1]}</div>

      </div>
    `).join("");

  const zones=heatmap.zones || [];
  const maxZ=Math.max(...zones.map(z=>z.visits),1);

  document.getElementById("heatmap").innerHTML =
    zones.length
      ? zones.map(z=>`
        <div class="bar-row">

          <div class="bar-label">${z.zone_name}</div>

          <div class="track">
            <div class="bar"
                 style="width:${(z.visits/maxZ)*100}%;
                 background:#a855f7">
            </div>
          </div>

          <div class="metric">${z.visits}</div>

        </div>
      `).join("")
      : "<div>No zone data</div>";
}

load();
setInterval(load,5000);

</script>

</body>
</html>
